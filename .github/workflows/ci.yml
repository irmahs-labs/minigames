name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Validate compose
        run: docker compose config --quiet

      - name: Docker build
        run: docker build -t minigames .
