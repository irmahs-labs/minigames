# The server. Deploys run `docker compose -f compose.prod.yaml …`; locally,
# plain `docker compose` uses compose.yaml.
#
# .env beside this file is written by the deploy from GitHub secrets, with
# the database password twice: as is for Postgres, and percent-encoded as
# POSTGRES_PASSWORD_URL for the postgres:// URLs, where a / or @ would break
# them. The database is reachable only on the internal network; Caddy reaches
# the site on the shared `proxy` network as `minigames:3000`, and the site
# reaches the account service there as `auth:3001`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minigames
      # Read once, when the volume is first created. Changing the secret later
      # does not change the database's password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: minigames
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigames -d minigames"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [internal]

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://minigames:${POSTGRES_PASSWORD_URL:?set in .env}@db:5432/minigames?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  app:
    build: .
    image: minigames
    restart: unless-stopped
    environment:
      APP_URL: https://minigames.irmahs.dev
      AUTH_INTERNAL_URL: http://auth:3001
      DATABASE_URL: postgres://minigames:${POSTGRES_PASSWORD_URL:?set in .env}@db:5432/minigames
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases: [minigames]

networks:
  internal:
  proxy:
    external: true

volumes:
  db_data:
